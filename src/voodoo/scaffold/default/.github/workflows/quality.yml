name: Generated app quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and starter tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app
      - name: Unit and accessibility smoke tests
        run: pytest -q
  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and browser tools
        run: |
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Start generated application
        env:
          VOODOO_ENV: test
          VOODOO_SECRET_KEY: generated-app-browser-secret
          VOODOO_HOST: 127.0.0.1
          VOODOO_PORT: "8766"
        run: |
          python -m uvicorn voodoo.core:app --host 127.0.0.1 --port 8766 > /tmp/voodoo-template.log 2>&1 &
          echo $! > /tmp/voodoo-template.pid
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8766/", timeout=1).close()
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("generated app did not start")
          PY
      - name: Run browser/a11y smoke test
        env:
          VOODOO_APP_URL: http://127.0.0.1:8766/
        run: pytest -q tests/browser
      - name: Stop generated application
        if: always()
        run: kill "$(cat /tmp/voodoo-template.pid)" 2>/dev/null || true
