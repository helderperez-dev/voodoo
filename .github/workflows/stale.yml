name: Stale

on:
  schedule:
    # Runs daily at 01:00 UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Mark stale issues & PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🧹 Mark stale
        uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: |
            This issue has been inactive for 60 days and is being marked as stale.
            It will be closed in 14 days unless there is further activity.
            Comment to remove the stale label, or close it if it's no longer relevant.
          close-issue-message: |
            This issue was closed because it has been stale for 14 days with no activity.
            Feel free to reopen if it's still relevant.
          exempt-issue-labels: "pinned,security,roadmap,good first issue"

          # Pull requests
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: |
            This PR has been inactive for 30 days and is being marked as stale.
            It will be closed in 7 days unless there is further activity.
          close-pr-message: |
            This PR was closed because it has been stale for 7 days with no activity.
            Feel free to reopen if it's still being worked on.
          exempt-pr-labels: "pinned,security,blocked"

          # Labels
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          close-issue-label: "wontfix"
          close-pr-label: "stale-closed"

          # Misc
          operations-per-run: 30
          remove-stale-when-updated: true
          debug-only: false
