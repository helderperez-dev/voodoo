name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.21)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      VOODOO_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: ⚙️ Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔢 Determine version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$VERSION' (expected semver, e.g. 1.0.21)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🧪 Run test suite
        run: uv run pytest

      - name: 🌐 Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: 🌐 Run browser experience gate
        env:
          VOODOO_BROWSER_TESTS: "1"
        run: >-
          uv run pytest tests/browser/test_component_lab_browser.py --tb=short
          -o asyncio_mode=strict

      - name: 🧪 Clean Store-first distribution gate
        run: |
          rm -rf /tmp/voodoo-release-clean /tmp/voodoo-release-app
          uv venv --python 3.12 /tmp/voodoo-release-clean
          uv pip install --python /tmp/voodoo-release-clean/bin/python -e .
          /tmp/voodoo-release-clean/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("aiosqlite") is None
          PY
          cd /tmp
          /tmp/voodoo-release-clean/bin/voodoo new voodoo-release-app --no-install
          cd voodoo-release-app
          /tmp/voodoo-release-clean/bin/python - <<'PY'
          from pathlib import Path

          from starlette.testclient import TestClient
          from voodoo import App

          app = App()
          with TestClient(app) as client:
              response = client.get("/")
              assert response.status_code == 200, response.text
              assert "Hello, Voodoo" in response.text
              assert client.get("/about").status_code == 200
              assert client.get("/users/42").status_code == 200

          store = Path(".voodoo/application.vstore")
          assert store.exists()
          assert store.stat().st_size > 0
          assert list(Path(".").rglob("*.db")) == []
          PY

      - name: 📝 Bump version in source files
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/voodoo/__init__.py

          echo "Bumped to $VERSION"
          grep '__version__' src/voodoo/__init__.py

      - name: 🏷️ Commit, tag and push
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          git add pyproject.toml src/voodoo/__init__.py
          git commit -m "chore(release): bump version to $TAG" || echo "Nothing to commit"
          git push origin main
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 🔨 Build distribution packages
        run: |
          rm -rf dist/
          uv build
          if tar -tzf dist/*.tar.gz | grep -E '(__pycache__/|\.py[cod]$)'; then
            echo "source distribution contains generated interpreter bytecode" >&2
            exit 1
          fi

      - name: 🧪 Test the exact release wheel
        run: |
          rm -rf /tmp/voodoo-release-artifact
          uv venv --python 3.12 /tmp/voodoo-release-artifact
          uv pip install --python /tmp/voodoo-release-artifact/bin/python dist/*.whl
          /tmp/voodoo-release-artifact/bin/python - <<'PY'
          import importlib.metadata
          import subprocess

          version = importlib.metadata.version("voodoo-framework")
          assert version == "${{ steps.get_version.outputs.VERSION }}", version
          result = subprocess.run(
              ["/tmp/voodoo-release-artifact/bin/voodoo", "version"],
              check=False,
              capture_output=True,
              text=True,
          )
          assert result.returncode == 0, result.stderr
          assert version in result.stdout, result.stdout
          PY

      - name: 🧪 Test the exact source distribution
        run: |
          rm -rf /tmp/voodoo-release-sdist
          uv venv --python 3.12 /tmp/voodoo-release-sdist
          uv pip install --python /tmp/voodoo-release-sdist/bin/python dist/*.tar.gz
          /tmp/voodoo-release-sdist/bin/python - <<'PY'
          import importlib.metadata
          import subprocess

          version = importlib.metadata.version("voodoo-framework")
          assert version == "${{ steps.get_version.outputs.VERSION }}", version
          result = subprocess.run(
              ["/tmp/voodoo-release-sdist/bin/voodoo", "version"],
              check=False,
              capture_output=True,
              text=True,
          )
          assert result.returncode == 0, result.stderr
          assert version in result.stdout, result.stdout
          PY

      - name: 🔐 Calculate SHA256
        id: sha
        run: |
          TAR_FILE=$(ls dist/*.tar.gz | head -n 1)
          SHA256=$(sha256sum "$TAR_FILE" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: 📋 Generate release manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          artifacts = []
          for path in sorted(Path("dist").iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({"file": path.name, "sha256": digest, "bytes": path.stat().st_size})
          manifest = {
              "package": "voodoo-framework",
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "artifacts": artifacts,
              "attestation": "GitHub Actions workflow identity; verify artifact provenance before promotion",
          }
          Path("dist/release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
      - name: ⬆️ Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: voodoo-release-manifest
          path: dist/release-manifest.json
          retention-days: 90
      - name: ✅ Verify release manifest
        run: uv run python scripts/verify_release_manifest.py dist

      - name: 📝 Generate and sign release notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          REVISION: ${{ github.sha }}
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
          RELEASE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.RELEASE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_B64" || { echo "RELEASE_SIGNING_KEY_B64 is required" >&2; exit 1; }
          test -n "$RELEASE_SIGNING_PUBLIC_KEY_B64" || { echo "RELEASE_SIGNING_PUBLIC_KEY_B64 is required" >&2; exit 1; }
          export VERSION REVISION
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey, Ed25519PublicKey

          version = os.environ["VERSION"]
          revision = os.environ["REVISION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^##\s+\[?{re.escape(version)}\]?[^\n]*\n(?P<body>.*?)(?=^##\s+|\Z)", changelog, re.MULTILINE | re.DOTALL)
          body = match.group("body").strip() if match else "No changelog section found."
          manifest = json.loads(Path("dist/release-manifest.json").read_text(encoding="utf-8"))
          lines = [
              f"# voodoo-framework {version}",
              "",
              f"- Source revision: `{revision}`",
              f"- Attestation subject: `voodoo-framework@{version}`",
              f"- Manifest version: `{manifest.get('manifest_version', 1)}`",
              "",
              "## Changes",
              "",
              body,
              "",
              "## Artifacts",
              "",
              "| File | SHA-256 | Bytes |",
              "| --- | --- | ---: |",
          ]
          lines.extend(f"| `{item['file']}` | `{item['sha256']}` | {item['bytes']} |" for item in manifest["artifacts"])
          notes = ("\n".join(lines) + "\n").encode("utf-8")
          Path("dist/release-notes.md").write_bytes(notes)
          private = serialization.load_pem_private_key(base64.b64decode(os.environ["RELEASE_SIGNING_KEY_B64"]), password=None)
          if not isinstance(private, Ed25519PrivateKey):
              raise SystemExit("release signing key must be Ed25519")
          public = private.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          trusted = base64.b64decode(os.environ["RELEASE_SIGNING_PUBLIC_KEY_B64"])
          if trusted != public:
              raise SystemExit("release signing public key does not match private key")
          signature = private.sign(notes)
          payload = {
              "schema_version": 1,
              "algorithm": "Ed25519",
              "notes_sha256": hashlib.sha256(notes).hexdigest(),
              "subject": f"voodoo-framework@{version}",
              "revision": revision,
              "public_key_b64": base64.b64encode(public).decode("ascii"),
              "signature_b64": base64.b64encode(signature).decode("ascii"),
          }
          Ed25519PublicKey.from_public_bytes(public).verify(signature, notes)
          Path("dist/release-notes.sig.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/release-notes.sig.json").read_text())
          assert payload["schema_version"] == 1
          assert payload["subject"] == f"voodoo-framework@{__import__('os').environ['VERSION']}"
          assert payload["revision"] == __import__('os').environ["REVISION"]
          print("verified signed release notes metadata")
          PY
      - name: ⬆️ Upload signed release notes
        uses: actions/upload-artifact@v7
        with:
          name: voodoo-release-notes
          path: |
            dist/release-notes.md
            dist/release-notes.sig.json
          retention-days: 90
      - name: 🔏 Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: 📤 Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish dist/*.whl dist/*.tar.gz

      - name: 🍺 Update Homebrew Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          FORMULA_CONTENT=$(cat <<EOF
          class Voodoo < Formula
            desc "Programmable runtime for adaptive applications and operational systems"
            homepage "https://github.com/helderperez-dev/voodoo"
            url "https://files.pythonhosted.org/packages/source/v/voodoo-framework/voodoo_framework-${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "uv"
            depends_on "python@3.12"

            def install
              ENV["UV_TOOL_DIR"] = libexec.to_s
              system "uv", "tool", "install", "voodoo-framework==#{version}", "--python", "3.12"

              tool_bin = libexec/"voodoo-framework/bin"
              brew_python = Formula["python@3.12"].bin/"python3.12"

              %w[python python3 python3.12].each do |name|
                link = tool_bin/name
                next unless File.symlink?(link.to_s)
                FileUtils.rm_f(link)
                File.symlink(brew_python, link)
              end

              voodoo_script = tool_bin/"voodoo"
              if voodoo_script.exist?
                content = File.read(voodoo_script)
                content.sub!(%r{^#!.*$}, "#!#{tool_bin}/python3.12")
                File.write(voodoo_script, content)
                chmod("+x", voodoo_script)
              end

              # Homebrew rewrites every Mach-O it finds in the keg. Voodoo
              # Store's prebuilt @rpath extension is already relocatable but has
              # no spare Mach-O header room for Homebrew's longer install name.
              # Hide it as gzip data during keg relocation and restore it in
              # post_install after Homebrew's relocation pass has completed.
              native = Dir[libexec/"**/site-packages/voodoo_store/_native.abi3.so"].first
              odie "voodoo_store native extension not found" if native.nil?
              system "gzip", "-f", native

              rm_rf Dir.glob(libexec/"**/site-packages/jiter/*.so")

              bin.install_symlink tool_bin/"voodoo"
            end

            def post_install
              native_gz = Dir[libexec/"**/site-packages/voodoo_store/_native.abi3.so.gz"].first
              return if native_gz.nil?

              system "gzip", "-d", native_gz
            end

            test do
              assert_match "Voodoo Framework CLI", shell_output("#{bin}/voodoo --help")
              system Formula["python@3.12"].opt_bin/"python3.12", "-c", "import voodoo_store"
              system bin/"voodoo", "new", "smoke-app", "--no-install"
              cd testpath/"smoke-app" do
                system libexec/"voodoo-framework/bin/python3.12", "-c", <<~PY
                  from pathlib import Path
                  from starlette.testclient import TestClient
                  from voodoo import App
                  app = App()
                  with TestClient(app) as client:
                      assert client.get('/').status_code == 200
                      assert client.get('/about').status_code == 200
                      assert client.get('/users/42').status_code == 200
                  assert Path('.voodoo/application.vstore').exists()
                  assert list(Path('.').rglob('*.db')) == []
                PY
              end
            end
          end
          EOF
          )

          B64_CONTENT=$(echo "$FORMULA_CONTENT" | base64 | tr -d '\n')
          FILE_SHA=$(gh api repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb --jq .sha || echo "")

          ARGS=(--method PUT repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb
                -f message="chore(release): update voodoo to ${VERSION}"
                -f content="$B64_CONTENT")
          if [ -n "$FILE_SHA" ]; then
            ARGS+=(-f sha="$FILE_SHA")
          fi

          gh api "${ARGS[@]}"
          echo "✓ Homebrew formula updated"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file dist/release-notes.md
          fi
          echo "✓ GitHub release $TAG done."
