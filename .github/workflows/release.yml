name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.21)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite
        run: uv run pytest

      - name: Bump version in source files
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" voodoo/__init__.py
          sed -i "s/ver = getattr(voodoo, \"__version__\", \".*\")/ver = getattr(voodoo, \"__version__\", \"$VERSION\")/" voodoo/cli.py

          echo "Bumped to $VERSION"
          grep '^version' pyproject.toml

      - name: Commit and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TAG="${{ steps.get_version.outputs.TAG }}"

          git add pyproject.toml voodoo/__init__.py voodoo/cli.py
          git commit -m "chore(release): bump version to $TAG" || echo "Nothing to commit"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build distribution packages
        run: |
          rm -rf dist/
          uv build

      - name: Calculate SHA256
        id: sha
        run: |
          TAR_FILE=$(ls dist/*.tar.gz | head -n 1)
          SHA256=$(sha256sum "$TAR_FILE" | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish

      - name: Update Homebrew Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          SHA256="${{ steps.sha.outputs.SHA256 }}"

          FORMULA_CONTENT=$(cat <<EOF
          class Voodoo < Formula
            include Language::Python::Virtualenv

            desc "Fast, Animated, AI-Powered Python Web Framework"
            homepage "https://github.com/helderperez-dev/voodoo"
            url "https://files.pythonhosted.org/packages/source/v/voodoo-framework/voodoo_framework-${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "python@3.12"

            def install
              virtualenv_install_with_resources
            end

            test do
              assert_match "Voodoo Framework CLI", shell_output("#{bin}/voodoo --help")
            end
          end
          EOF
          )

          B64_CONTENT=$(echo "$FORMULA_CONTENT" | base64 | tr -d '\n')
          FILE_SHA=$(gh api repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb --jq .sha || echo "")

          if [ -n "$FILE_SHA" ]; then
            gh api --method PUT repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb \
              -f message="chore(release): update voodoo to ${VERSION}" \
              -f content="$B64_CONTENT" \
              -f sha="$FILE_SHA"
            echo "✓ Homebrew formula updated"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
          echo "✓ GitHub release $TAG done."

