name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.21)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$VERSION' (expected semver, e.g. 1.0.21)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite
        run: uv run pytest

      - name: Bump version in source files
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/voodoo/__init__.py

          echo "Bumped to $VERSION"
          grep '__version__' src/voodoo/__init__.py

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          git add pyproject.toml src/voodoo/__init__.py
          git commit -m "chore(release): bump version to $TAG" || echo "Nothing to commit"
          git push origin main
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Build distribution packages
        run: |
          rm -rf dist/
          uv build

      - name: Calculate SHA256
        id: sha
        run: |
          TAR_FILE=$(ls dist/*.tar.gz | head -n 1)
          SHA256=$(sha256sum "$TAR_FILE" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish

      - name: Update Homebrew Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          FORMULA_CONTENT=$(cat <<EOF
          class Voodoo < Formula
            desc "Fast, Animated, AI-Powered Python Web Framework"
            homepage "https://github.com/helderperez-dev/voodoo"
            url "https://files.pythonhosted.org/packages/source/v/voodoo-framework/voodoo_framework-${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "uv"
            depends_on "python@3.12"

            def install
              # Use uv instead of pip to avoid truststore bug on macOS Tahoe
              system "uv", "venv", libexec, "--python", "3.12"
              system "uv", "pip", "install", "--python", libexec/"bin/python", "voodoo-framework"
              bin.install_symlink libexec/"bin/voodoo"
            end

            test do
              assert_match "Voodoo Framework CLI", shell_output("#{bin}/voodoo --help")
            end
          end
          EOF
          )

          B64_CONTENT=$(echo "$FORMULA_CONTENT" | base64 | tr -d '\n')
          FILE_SHA=$(gh api repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb --jq .sha || echo "")

          ARGS=(--method PUT repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb
                -f message="chore(release): update voodoo to ${VERSION}"
                -f content="$B64_CONTENT")
          if [ -n "$FILE_SHA" ]; then
            ARGS+=(-f sha="$FILE_SHA")
          fi

          gh api "${ARGS[@]}"
          echo "✓ Homebrew formula updated"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
          echo "✓ GitHub release $TAG done."
