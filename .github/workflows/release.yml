name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.21)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL service container (Sprint 11): runs the queue/events/execution
    # contract + failure-path suites against a real server at release time.
    # MinIO service container (Sprint 12): runs the object store contract
    # suite against a real S3-compatible server at release time.
    # Redis service container (Sprint 13): runs the queue + cache contract
    # suites against a real server at release time.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        # minio/minio:latest CMD is bare `minio` (prints help + exits), so the
        # server must be started explicitly — same as `just minio-up`.
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Makes the PostgreSQL contract + failure-path tests run instead of skip.
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      # Makes the S3 object store contract tests run instead of skip.
      VOODOO_TEST_S3_ENDPOINT: http://localhost:9000
      VOODOO_TEST_S3_BUCKET: voodoo-test
      VOODOO_TEST_S3_KEY: minioadmin
      VOODOO_TEST_S3_SECRET: minioadmin
      # Makes the Redis queue + cache contract tests run instead of skip.
      VOODOO_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT (RELEASE_TOKEN) so the version-bump commit + tag can be
          # pushed to the protected `main` branch even with enforce_admins.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: ⚙️ Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔢 Determine version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$VERSION' (expected semver, e.g. 1.0.21)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🧪 Run test suite
        run: uv run pytest

      - name: 📝 Bump version in source files
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/voodoo/__init__.py

          echo "Bumped to $VERSION"
          grep '__version__' src/voodoo/__init__.py

      - name: 🏷️ Commit, tag and push
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          git add pyproject.toml src/voodoo/__init__.py
          git commit -m "chore(release): bump version to $TAG" || echo "Nothing to commit"
          git push origin main
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 🔨 Build distribution packages
        run: |
          rm -rf dist/
          uv build

      - name: 🔐 Calculate SHA256
        id: sha
        run: |
          TAR_FILE=$(ls dist/*.tar.gz | head -n 1)
          SHA256=$(sha256sum "$TAR_FILE" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: 📤 Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish

      - name: 🍺 Update Homebrew Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          FORMULA_CONTENT=$(cat <<EOF
          class Voodoo < Formula
            desc "Fast, Animated, AI-Powered Python Web Framework"
            homepage "https://github.com/helderperez-dev/voodoo"
            url "https://files.pythonhosted.org/packages/source/v/voodoo-framework/voodoo_framework-${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "uv"
            depends_on "python@3.12"

            def install
              # Use uv tool install — uv manages its own Python for the install step
              # (avoids pip's truststore bug and Homebrew's broken platform.mac_ver()
              # on macOS Tahoe 26.x). After install, rewrite shebangs to use Homebrew's Python.
              ENV["UV_TOOL_DIR"] = libexec.to_s
              system "uv", "tool", "install", "voodoo-framework", "--python", "3.12"

              tool_bin = libexec/"voodoo-framework/bin"
              brew_python = Formula["python@3.12"].bin/"python3.12"

              # Replace ALL python symlinks (including broken ones) with Homebrew Python.
              # Use lstat to detect broken symlinks (File.exist? returns false for those).
              %w[python python3 python3.12].each do |name|
                link = tool_bin/name
                next unless File.symlink?(link.to_s)
                FileUtils.rm_f(link)
                File.symlink(brew_python, link)
              end

              # Rewrite shebang in the voodoo script
              voodoo_script = tool_bin/"voodoo"
              if voodoo_script.exist?
                content = File.read(voodoo_script)
                content.sub!(%r{^#!.*$}, "#!#{tool_bin}/python3.12")
                File.write(voodoo_script, content)
                chmod("+x", voodoo_script)
              end

              # Remove .so files whose Mach-O headers lack padding for Homebrew's dylib fixup.
              rm_rf Dir.glob(libexec/"**/site-packages/jiter/*.so")

              bin.install_symlink tool_bin/"voodoo"
            end

            test do
              assert_match "Voodoo Framework CLI", shell_output("#{bin}/voodoo --help")
            end
          end
          EOF
          )

          B64_CONTENT=$(echo "$FORMULA_CONTENT" | base64 | tr -d '\n')
          FILE_SHA=$(gh api repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb --jq .sha || echo "")

          ARGS=(--method PUT repos/helderperez-dev/homebrew-voodoo/contents/Formula/voodoo.rb
                -f message="chore(release): update voodoo to ${VERSION}"
                -f content="$B64_CONTENT")
          if [ -n "$FILE_SHA" ]; then
            ARGS+=(-f sha="$FILE_SHA")
          fi

          gh api "${ARGS[@]}"
          echo "✓ Homebrew formula updated"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
          echo "✓ GitHub release $TAG done."
