name: Temporary Ruff Fix

on:
  push:
    branches:
      - feat/application-graph-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(format): apply ruff')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/application-graph-foundation
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --dev
      - name: Format safely with Ruff
        run: |
          uv run --python 3.12 ruff format .
          uv run --python 3.12 ruff check --fix . || true
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(format): apply ruff"
          git push origin HEAD:feat/application-graph-foundation
