name: Sprint 28 Identity Engine Wiring

on:
  push:
    branches:
      - sprint-28-runtime-infrastructure-convergence

permissions:
  contents: write

jobs:
  wire-principal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sprint-28-runtime-infrastructure-convergence
      - name: Wire Principal into ExecutionEngine
        shell: python
        run: |
          from pathlib import Path

          engine = Path("src/voodoo/runtime/engine.py")
          text = engine.read_text()
          text = text.replace(
              "from voodoo.runtime.execution import Execution, ExecutionStatus\n",
              "from voodoo.runtime.execution import Execution, ExecutionStatus\nfrom voodoo.runtime.identity import Principal\n",
          )
          text = text.replace(
              "        actor: str = \"system\",\n        capabilities: list[str] | None = None,\n",
              "        actor: str = \"system\",\n        principal: Principal | None = None,\n        capabilities: list[str] | None = None,\n",
              1,
          )
          text = text.replace(
              "        ctx = self._build_context(intent, actor=actor, parent=parent)\n",
              "        ctx = self._build_context(\n            intent, actor=actor, principal=principal, parent=parent\n        )\n",
              1,
          )
          text = text.replace(
              "            actor=actor,\n            capabilities=[c.name for c in ctx.capabilities],\n",
              "            actor=ctx.actor,\n            capabilities=[c.name for c in ctx.capabilities],\n",
              1,
          )
          old = '''    def _build_context(
              self, intent: Intent, *, actor: str, parent: ExecutionContext | None
          ) -> ExecutionContext:
              if parent is not None:
                  ctx = parent.child(actor=actor)
                  ctx.intent = intent
                  return ctx
              ctx = ExecutionContext(actor=actor, intent=intent)
              ctx.engine = self
          '''
          new = '''    def _build_context(
              self,
              intent: Intent,
              *,
              actor: str,
              principal: Principal | None,
              parent: ExecutionContext | None,
          ) -> ExecutionContext:
              if parent is not None:
                  ctx = parent.child(actor=actor)
                  if principal is not None:
                      ctx.principal = principal
                      if actor == "system":
                          ctx.actor = principal.actor
                  ctx.intent = intent
                  return ctx
              ctx = ExecutionContext(actor=actor, principal=principal, intent=intent)
              ctx.engine = self
          '''
          if old not in text:
              raise SystemExit("ExecutionEngine _build_context pattern not found")
          text = text.replace(old, new, 1)
          engine.write_text(text)

          runtime = Path("src/voodoo/runtime/__init__.py")
          text = runtime.read_text()
          text = text.replace(
              "    actor: str = \"system\",\n    capabilities: list[str] | None = None,\n",
              "    actor: str = \"system\",\n    principal: Principal | None = None,\n    capabilities: list[str] | None = None,\n",
              1,
          )
          text = text.replace(
              "        actor=actor,\n        capabilities=capabilities,\n",
              "        actor=actor,\n        principal=principal,\n        capabilities=capabilities,\n",
              1,
          )
          runtime.write_text(text)
      - name: Format
        run: |
          python -m pip install ruff==0.16.3
          ruff format src/voodoo/runtime/engine.py src/voodoo/runtime/__init__.py
          ruff check --fix src/voodoo/runtime/engine.py src/voodoo/runtime/__init__.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/voodoo/runtime/engine.py src/voodoo/runtime/__init__.py
          git commit -m "feat(identity): carry Principal through canonical Execution"
          git push origin HEAD:sprint-28-runtime-infrastructure-convergence
