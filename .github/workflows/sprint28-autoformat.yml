name: Sprint 28 Autoformat

on:
  push:
    branches:
      - sprint-28-runtime-infrastructure-convergence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'style: apply Ruff formatting')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sprint-28-runtime-infrastructure-convergence
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: latest

      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --dev
      - run: uv run --python 3.12 ruff format .

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:sprint-28-runtime-infrastructure-convergence
