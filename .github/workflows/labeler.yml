name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Auto-label PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Label PR
        uses: actions/labeler@v4
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
