name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint — fast feedback on code style & formatting
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🧹 Ruff format check
        run: .venv/bin/ruff format --check .

      - name: 🔍 Ruff lint
        run: .venv/bin/ruff check .

  # ─────────────────────────────────────────────────────────────────────
  # Type check — architectural sprint protocol requires this to be green
  # ─────────────────────────────────────────────────────────────────────
  typecheck:
    name: 🔷 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🔷 Run mypy
        run: .venv/bin/mypy src/voodoo

  # ─────────────────────────────────────────────────────────────────────
  # Lean package smoke test — base wheel must not require AI provider SDKs
  # ─────────────────────────────────────────────────────────────────────
  package-smoke:
    name: 📦 Lean Package Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 🏗️ Build wheel
        run: uv build --wheel

      - name: 🧪 Install base wheel in clean environment
        run: |
          uv venv --python 3.12 /tmp/voodoo-lean
          uv pip install --python /tmp/voodoo-lean/bin/python dist/*.whl

      - name: ✅ Verify lean core
        run: |
          /tmp/voodoo-lean/bin/python - <<'PY'
          import importlib.util
          import voodoo
          from voodoo.ai.providers import get_provider

          assert importlib.util.find_spec("openai") is None, "openai leaked into base install"
          provider = get_provider("mock:test")
          assert provider.name == "mock"
          print(f"voodoo {voodoo.__version__}: lean core OK")
          PY

  # ─────────────────────────────────────────────────────────────────────
  # Test — full pytest suite with service containers
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      VOODOO_TEST_S3_ENDPOINT: http://localhost:9000
      VOODOO_TEST_S3_BUCKET: voodoo-test
      VOODOO_TEST_S3_KEY: minioadmin
      VOODOO_TEST_S3_SECRET: minioadmin
      VOODOO_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 📦 Install dependencies for Python ${{ matrix.python-version }}
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: 🔎 Verify matrix interpreter
        run: |
          .venv/bin/python - <<'PY'
          import sys

          expected = "${{ matrix.python-version }}"
          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert actual == expected, f"expected Python {expected}, got {actual}"
          print(f"Python matrix verified: {actual}")
          PY

      - name: 🧪 Run pytest suite
        run: .venv/bin/pytest --tb=short

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .test-results/
            .pytest_cache/
          retention-days: 7
