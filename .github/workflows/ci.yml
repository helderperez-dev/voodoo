name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    # PostgreSQL service container (Sprint 10): runs the database contract
    # suite against a real server. The voodoo database provider itself talks
    # to it over TCP on localhost:5432.
    # MinIO service container (Sprint 12): runs the object store contract
    # suite against a real S3-compatible server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Makes tests/contracts/test_database_postgres.py run instead of skip.
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      # Makes tests/contracts/test_objectstore_s3.py run instead of skip.
      VOODOO_TEST_S3_ENDPOINT: http://localhost:9000
      VOODOO_TEST_S3_BUCKET: voodoo-test
      VOODOO_TEST_S3_KEY: minioadmin
      VOODOO_TEST_S3_SECRET: minioadmin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest suite
        run: uv run pytest
