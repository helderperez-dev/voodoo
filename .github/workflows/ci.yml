name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🧹 Ruff format check
        run: uv run --python 3.12 ruff format --check .

      - name: 🔍 Ruff lint
        run: uv run --python 3.12 ruff check .

  typecheck:
    name: 🔎 Type Check — converged runtime boundary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🔎 Mypy — production-critical boundaries
        run: >-
          uv run --python 3.12 mypy --follow-imports=silent
          src/voodoo/runtime/planner.py
          src/voodoo/edge/world.py
          src/voodoo/protocol/operational.py
          src/voodoo/config.py
          src/voodoo/auth/middleware.py
          src/voodoo/security
          src/voodoo/ui/events.py
          src/voodoo/ui/state.py
          src/voodoo/routing/pages.py
          src/voodoo/cli/new.py
          src/voodoo/cli/create.py

  typecheck-ratchet:
    name: 🔎 Full-package Mypy Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12
      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev
      - name: 🔎 Run full-package Mypy ratchet
        run: uv run --python 3.12 python scripts/check_mypy_ratchet.py

  documentation:
    name: 📚 Documentation Import Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12
      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev
      - name: 📚 Validate documented imports
        run: uv run --python 3.12 python scripts/check_docs_imports.py
      - name: 🧭 Validate canonical onboarding command
        run: uv run --python 3.12 python scripts/check_command_contract.py
      - name: 🧩 Validate component maturity
        run: uv run --python 3.12 python scripts/check_component_maturity.py
      - name: 🎛️ Validate design token contract
        run: uv run --python 3.12 python scripts/check_design_tokens.py
      - name: 🎨 Validate component style-token contract
        run: uv run --python 3.12 python scripts/check_component_style_tokens.py
      - name: 🗃️ Validate durable encoding inventory
        run: uv run --python 3.12 python scripts/check_encoding_inventory.py
      - name: 🧬 Validate durable migration corpus
        run: uv run --python 3.12 python scripts/check_migration_corpus.py
      - name: 🧯 Validate exception contract
        run: uv run --python 3.12 python scripts/check_exception_contract.py
      - name: ♿ Validate accessibility contract
        run: uv run --python 3.12 python scripts/check_accessibility_contract.py
      - name: 🧱 Validate control state contract
        run: uv run --python 3.12 python scripts/check_control_state_contract.py
      - name: 🔁 Validate API compatibility registry
        run: uv run --python 3.12 python scripts/check_api_compatibility.py
      - name: 🎨 Validate visual regression contract
        run: uv run --python 3.12 python scripts/check_visual_contract.py

  dependency-audit:
    name: 🔐 Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12
      - name: 📦 Export shipped base dependencies
        run: uv export --python 3.12 --no-dev --no-hashes > /tmp/voodoo-requirements.txt
      - name: 🔐 Audit shipped Python dependencies
        run: |
          python -m venv /tmp/voodoo-audit
          /tmp/voodoo-audit/bin/python -m pip install --quiet "pip-audit==2.10.1"
          /tmp/voodoo-audit/bin/pip-audit -r /tmp/voodoo-requirements.txt
      - name: 📋 Generate shipped dependency SBOM
        run: |
          /tmp/voodoo-audit/bin/pip-audit -r /tmp/voodoo-requirements.txt \
            --format cyclonedx-json --output voodoo-base-sbom.json
      - name: ⬆️ Upload dependency SBOM
        uses: actions/upload-artifact@v7
        with:
          name: voodoo-base-sbom
          path: voodoo-base-sbom.json
          retention-days: 30

  clean-install:
    name: 🧪 Clean Store-first Install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 🔨 Build wheel
        run: uv build --wheel

      - name: 📦 Install wheel without extras
        run: |
          uv venv --python 3.12 /tmp/voodoo-clean
          uv pip install --python /tmp/voodoo-clean/bin/python dist/*.whl

      - name: 🚫 Verify optional SQLite is absent
        run: |
          /tmp/voodoo-clean/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("aiosqlite") is None
          PY

      - name: 🪄 Scaffold and run full Runtime lifecycle
        run: |
          cd /tmp
          rm -rf voodoo-clean-app
          /tmp/voodoo-clean/bin/voodoo new voodoo-clean-app --no-install
          cd voodoo-clean-app
          /tmp/voodoo-clean/bin/python - <<'PY'
          from pathlib import Path

          from starlette.testclient import TestClient
          from voodoo import App

          app = App()
          with TestClient(app) as client:
              response = client.get("/")
              assert response.status_code == 200, response.text
              assert "Hello, Voodoo" in response.text
              assert client.get("/about").status_code == 200
              assert client.get("/users/42").status_code == 200

          store = Path(".voodoo/application.vstore")
          assert store.exists()
          assert store.stat().st_size > 0
          assert list(Path(".").rglob("*.db")) == []
          PY

  browser:
    name: 🌐 Browser Experience Gate (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install browser test dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🌐 Install Playwright browser
        run: uv run --python 3.12 playwright install --with-deps ${{ matrix.browser }}

      - name: 🧪 Run Component Lab browser acceptance
        env:
          VOODOO_BROWSER_TESTS: "1"
          VOODOO_BROWSER_NAME: ${{ matrix.browser }}
        run: >-
          uv run --python 3.12 pytest
          tests/browser/test_component_lab_browser.py --tb=short
          -o asyncio_mode=strict

      - name: 🖼️ Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-lab-visual-baselines-${{ matrix.browser }}
          path: .test-results/browser/
          if-no-files-found: warn
          retention-days: 14

  optional-extras:
    name: 🧩 Optional provider extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extra: [ai, browser, edge, otel, postgres, redis, s3]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12
      - name: 📦 Install only this provider family
        run: uv sync --python 3.12 --extra ${{ matrix.extra }} --extra dev
      - name: 🔌 Import provider family
        env:
          VOODOO_OPTIONAL_EXTRA: ${{ matrix.extra }}
        run: uv run --python 3.12 python scripts/check_optional_extra.py

  test:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      VOODOO_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: 🧪 Run pytest suite
        run: >-
          uv run --python ${{ matrix.python-version }} pytest --tb=short
          -W error::RuntimeWarning
          -W error::pytest.PytestUnhandledThreadExceptionWarning

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .test-results/
            .pytest_cache/
          retention-days: 7

  platform-contract:
    name: 🖥️ Platform Contract (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: 📦 Install framework and development dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev
      - name: ✅ Run platform-safe package contract
        run: uv run --python ${{ matrix.python-version }} python scripts/platform_contract.py
