name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🧹 Ruff format check
        run: uv run --python 3.12 ruff format --check .

      - name: 🔍 Ruff lint
        run: uv run --python 3.12 ruff check .

  typecheck:
    name: 🔎 Type Check — converged runtime boundary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --python 3.12 --all-extras --dev

      - name: 🔎 Mypy — Sprint 27 boundary
        run: >-
          uv run --python 3.12 mypy --follow-imports=silent
          src/voodoo/runtime/planner.py
          src/voodoo/edge/world.py
          src/voodoo/protocol/operational.py

  clean-install:
    name: 🧪 Clean Store-first Install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 🔨 Build wheel
        run: uv build --wheel

      - name: 📦 Install wheel without extras
        run: |
          uv venv --python 3.12 /tmp/voodoo-clean
          uv pip install --python /tmp/voodoo-clean/bin/python dist/*.whl

      - name: 🚫 Verify optional SQLite is absent
        run: |
          /tmp/voodoo-clean/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("aiosqlite") is None
          PY

      - name: 🪄 Scaffold and run full Runtime lifecycle
        run: |
          cd /tmp
          rm -rf voodoo-clean-app
          /tmp/voodoo-clean/bin/voodoo create voodoo-clean-app
          cd voodoo-clean-app
          /tmp/voodoo-clean/bin/python - <<'PY'
          import runpy
          from pathlib import Path
          from starlette.testclient import TestClient

          namespace = runpy.run_path("main.py", run_name="clean_install_app")
          with TestClient(namespace["app"]) as client:
              response = client.get("/")
              assert response.status_code == 200, response.text
              assert "Hello, Voodoo" in response.text

          store = Path(".voodoo/application.vstore")
          assert store.exists()
          assert store.stat().st_size > 0
          PY

  test:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      VOODOO_TEST_S3_ENDPOINT: http://localhost:9000
      VOODOO_TEST_S3_BUCKET: voodoo-test
      VOODOO_TEST_S3_KEY: minioadmin
      VOODOO_TEST_S3_SECRET: minioadmin
      VOODOO_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: 🧪 Run pytest suite
        run: >-
          uv run --python ${{ matrix.python-version }} pytest --tb=short
          -W error::RuntimeWarning
          -W error::pytest.PytestUnhandledThreadExceptionWarning

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .test-results/
            .pytest_cache/
          retention-days: 7
