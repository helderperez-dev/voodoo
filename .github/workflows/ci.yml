name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint — fast feedback on code style & formatting
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python 3.12
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🧹 Ruff format check
        run: uv run ruff format --check .

      - name: 🔍 Ruff lint
        run: uv run ruff check .

  # ─────────────────────────────────────────────────────────────────────
  # Test — full pytest suite with service containers
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # PostgreSQL service container (Sprint 10): runs the database contract
    # suite against a real server. The voodoo database provider itself talks
    # to it over TCP on localhost:5432.
    # MinIO service container (Sprint 12): runs the object store contract
    # suite against a real S3-compatible server.
    # Redis service container (Sprint 13): runs the queue + cache contract
    # suites against a real server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voodoo_test
          POSTGRES_USER: voodoo
          POSTGRES_PASSWORD: voodoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voodoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        # minio/minio:latest CMD is bare `minio` (prints help + exits), so the
        # server must be started explicitly — same as `just minio-up`.
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Makes tests/contracts/test_database_postgres.py run instead of skip.
      VOODOO_TEST_DATABASE_URL: postgresql://voodoo:voodoo@localhost:5432/voodoo_test
      # Makes tests/contracts/test_objectstore_s3.py run instead of skip.
      VOODOO_TEST_S3_ENDPOINT: http://localhost:9000
      VOODOO_TEST_S3_BUCKET: voodoo-test
      VOODOO_TEST_S3_KEY: minioadmin
      VOODOO_TEST_S3_SECRET: minioadmin
      # Makes tests/contracts/test_queue_redis.py + test_cache_redis.py run
      # instead of skip.
      VOODOO_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        run: uv sync --all-extras --dev

      - name: 🧪 Run pytest suite
        run: uv run pytest --tb=short

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .test-results/
            .pytest_cache/
          retention-days: 7
