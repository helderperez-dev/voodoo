name: Sprint 28 Node Identity Format

on:
  push:
    branches:
      - sprint-28-runtime-infrastructure-convergence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sprint-28-runtime-infrastructure-convergence
      - name: Format node identity slice
        run: |
          python -m pip install ruff==0.16.3
          ruff format src/voodoo/mesh/__init__.py src/voodoo/mesh/auth.py tests/test_mesh_remote_auth.py
          ruff check --fix src/voodoo/mesh/__init__.py src/voodoo/mesh/auth.py tests/test_mesh_remote_auth.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/voodoo/mesh/__init__.py src/voodoo/mesh/auth.py tests/test_mesh_remote_auth.py
          git commit -m "style(mesh): format node identity slice"
          git push origin HEAD:sprint-28-runtime-infrastructure-convergence
