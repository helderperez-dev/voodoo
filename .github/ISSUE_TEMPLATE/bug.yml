name: Bug report
description: Report a reproducible correctness or production issue.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include package versions, OS, Python, and Store format.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
