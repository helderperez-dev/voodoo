# Labeler configuration — maps file paths to labels on PRs.
# Used by .github/workflows/labeler.yml (actions/labeler@v5).
# v5 syntax: any-glob-to-any-file / all-globs-to-any-file

# ── Type labels ───────────────────────────────────────────────────────
"type: bug":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
      - all-globs-to-any-file:
          - "src/voodoo/**/*.py"

"type: feature":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/**/*.py"
          - "examples/**/*.py"

"type: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
          - "ROADMAP.md"
          - "SPRINT_PLAN.md"
          - "CHANGELOG.md"
          - "README.md"

"type: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "justfile"

"type: refactor":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/**/*.py"

# ── Area labels ───────────────────────────────────────────────────────
"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/core/**"
          - "src/voodoo/primitives/**"
          - "src/voodoo/runtime/**"
          - "src/voodoo/world/**"
          - "src/voodoo/edge/**"
          - "src/voodoo/protocol/**"
          - "src/voodoo/routing/**"
          - "src/voodoo/__init__.py"
          - "src/voodoo/config.py"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/ui/**"
          - "src/voodoo/components.py"

"area: data":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/data/**"
          - "src/voodoo/storage/**"
          - "src/voodoo/adapters/**"

"area: ai":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/ai/**"
          - "src/voodoo/integrations/ai/**"
          - "src/voodoo/integrations/mcp/**"

"area: mesh":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/mesh/**"

# Legacy label name retained for repository-label compatibility; ownership is Runtime scheduling.
"area: workers":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/runtime/scheduling/**"
          - "src/voodoo/schedule.py"

"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/auth/**"
          - "src/voodoo/security/**"

# Legacy label name retained for repository-label compatibility; canonical owner is observability.
"area: telemetry":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/observability/**"
          - "src/voodoo/integrations/otel.py"

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/cli/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

# ── Dependency labels ─────────────────────────────────────────────────
"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
