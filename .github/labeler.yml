# Labeler configuration — maps file paths to labels on PRs.
# Used by .github/workflows/labeler.yml (actions/labeler@v5).
# v5 syntax: any-glob-to-any-file / all-globs-to-any-file

# ── Type labels ───────────────────────────────────────────────────────
"type: bug":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
      - all-globs-to-any-file:
          - "src/voodoo/**/*.py"

"type: feature":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/**/*.py"
          - "examples/**/*.py"

"type: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
          - "ROADMAP.md"
          - "SPRINT_PLAN.md"
          - "CHANGELOG.md"
          - "README.md"

"type: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "justfile"

"type: refactor":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/**/*.py"

# ── Area labels ───────────────────────────────────────────────────────
"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/core/**"
          - "src/voodoo/__init__.py"
          - "src/voodoo/config.py"
          - "src/voodoo/api.py"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/ui/**"
          - "src/voodoo/components.py"
          - "src/voodoo/theme.py"

"area: data":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/data/**"
          - "src/voodoo/storage/**"

"area: ai":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/ai/**"
          - "src/voodoo/agent.py"
          - "src/voodoo/tools/**"
          - "src/voodoo/mcp/**"

"area: mesh":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/mesh/**"

"area: workers":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/workers/**"
          - "src/voodoo/queue.py"
          - "src/voodoo/schedule.py"

"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/auth/**"
          - "src/voodoo/security/**"

"area: telemetry":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/telemetry/**"

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "src/voodoo/cli/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

# ── Dependency labels ─────────────────────────────────────────────────
"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
