[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voodoo-framework"
dynamic = ["version"]
description = "The programmable runtime for adaptive applications and operational systems — web, APIs, agents, workers, human workflows, distributed systems, and physical systems in one runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Helder Perez", email = "contact@helderperez.com" },
]
maintainers = [
    { name = "Helder Perez", email = "contact@helderperez.com" },
]
keywords = [
    "ai",
    "agent",
    "application-framework",
    "async",
    "durable-execution",
    "mcp",
    "realtime",
    "reactive",
    "web-framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "starlette",
    "uvicorn",
    "pydantic",
    "aiosqlite",
    "websockets",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "typer",
    "rich",
    "openai",
    "aiofiles"
]

[project.urls]
Homepage = "https://github.com/helderperez-dev/voodoo"
Documentation = "https://github.com/helderperez-dev/voodoo#documentation"
Repository = "https://github.com/helderperez-dev/voodoo"
Changelog = "https://github.com/helderperez-dev/voodoo/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/helderperez-dev/voodoo/blob/main/ROADMAP.md"
Issues = "https://github.com/helderperez-dev/voodoo/issues"
Discussions = "https://github.com/helderperez-dev/voodoo/discussions"

[project.scripts]
voodoo = "voodoo.cli:app"

[project.optional-dependencies]
ai = [
    "openai",
    "anthropic",
    "google-generativeai",
    "ollama"
]
mcp = []
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit"
]
postgres = [
    "psycopg[binary]>=3.3.4",
]
s3 = [
    "boto3>=1.34",
    "botocore>=1.34",
]
redis = [
    "redis>=5.0",
]
edge = [
    "paho-mqtt>=2.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[tool.setuptools.dynamic]
version = { attr = "voodoo.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["voodoo*"]

[tool.setuptools.package-data]
voodoo = ["py.typed", "static/*.js", "*.html", "*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long — handled by ruff format; unavoidable in embedded HTML/JS strings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
